<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MentorMatch Login</title>

   <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>

<body>

<div class="container">

    <div class="login-card">

        <h1>MentorMatch</h1>

        <p>Mentorship Management System</p>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <div class="links">

            <a href="register-student.html">
                Register as Student
            </a>

            <a href="register-mentor.html">
                Register as Mentor
            </a>

        </div>

    </div>

</div>

 <script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/login.js' %}"></script>
</body>
</html>
